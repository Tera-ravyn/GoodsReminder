[package]
name = "goods-reminder"
version = "0.1.0"
description = "A Tauri App"
authors = ["RavynTera"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.57"

[build-dependencies]
tauri-build = { version = "2.0.0-rc.13", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0-rc.13", features = [] }
dirs = "5.0"
log = "0.4"
tauri-plugin-log = "2.0.0-rc.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]


